<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumen Vortex — Sacred Resonance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/sanctuary.css" />
</head>
<body>
  <div class="veil"></div>
  <div class="sacred-geometry" aria-hidden="true">
    <svg viewBox="0 0 400 400" class="mandala">
      <defs>
        <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#c9a84c" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="#7b68a6" stop-opacity="0.25"/>
        </linearGradient>
      </defs>
      <circle cx="200" cy="200" r="180" fill="none" stroke="url(#g1)" stroke-width="0.6"/>
      <circle cx="200" cy="200" r="140" fill="none" stroke="url(#g1)" stroke-width="0.5"/>
      <circle cx="200" cy="200" r="95" fill="none" stroke="url(#g1)" stroke-width="0.4"/>
      <circle cx="200" cy="200" r="50" fill="none" stroke="url(#g1)" stroke-width="0.35"/>
      <!-- Vesica & petals -->
      <g stroke="url(#g1)" stroke-width="0.45" fill="none">
        <ellipse cx="200" cy="200" rx="140" ry="70" transform="rotate(0 200 200)"/>
        <ellipse cx="200" cy="200" rx="140" ry="70" transform="rotate(60 200 200)"/>
        <ellipse cx="200" cy="200" rx="140" ry="70" transform="rotate(120 200 200)"/>
      </g>
      <circle cx="200" cy="200" r="6" fill="#c9a84c" opacity="0.7"/>
    </svg>
  </div>

  <main class="sanctuary">
    <header>
      <p class="whisper">the still point in the turning world</p>
      <h1>Lumen Vortex</h1>
      <p class="subtitle">A contemplative engine of harmonic resonance</p>
    </header>

    <section class="controls">
      <div class="field">
        <label for="seed">Seed of Intention</label>
        <input type="number" id="seed" value="42" min="0" max="999999" />
      </div>
      <div class="field">
        <label for="notes">Breaths (notes)</label>
        <input type="range" id="notes" min="48" max="240" value="128" />
        <span id="notes-val">128</span>
      </div>
      <div class="field">
        <label for="tempo">Pulse (BPM)</label>
        <input type="range" id="tempo" min="48" max="110" value="72" />
        <span id="tempo-val">72</span>
      </div>
      <div class="field">
        <label for="intention">Quality of Presence</label>
        <select id="intention">
          <option value="stillness">Stillness</option>
          <option value="devotion">Devotion</option>
          <option value="wonder">Wonder</option>
          <option value="release">Release</option>
          <option value="awakening">Awakening</option>
        </select>
      </div>

      <button id="invoke" class="invoke">
        <span class="btn-text">Invoke Resonance</span>
        <span class="btn-spinner hidden">···</span>
      </button>
    </section>

    <section class="result hidden" id="result">
      <div class="metrics">
        <div class="metric">
          <span class="label">Stepwise Flow</span>
          <span class="value" id="m-step">—</span>
        </div>
        <div class="metric">
          <span class="label">Repetition</span>
          <span class="value" id="m-rep">—</span>
        </div>
        <div class="metric">
          <span class="label">Mean Interval</span>
          <span class="value" id="m-int">—</span>
        </div>
        <div class="metric">
          <span class="label">Tonal Center</span>
          <span class="value" id="m-key">—</span>
        </div>
      </div>

      <div class="player">
        <audio id="audio" controls></audio>
        <p class="duration" id="duration"></p>
      </div>

      <p class="blessing" id="blessing"></p>
    </section>

    <footer>
      <p>Built upon the Vortex Music Engine · offered in the spirit of listening</p>
    </footer>
  </main>

  <script src="/static/js/sanctuary.js"></script>
</body>
</html>
